const canvas=document.getElementById('cartao'),ctx=canvas.getContext('2d');
const ids=['data','titulo','orientacao','prazo'];
function text(txt,x,y,size,color,bold=false,maxWidth=850){
 ctx.fillStyle=color;ctx.font=(bold?'700 ':'')+size+'px Arial, sans-serif';
 let val=txt||''; while(ctx.measureText(val).width>maxWidth&&val.length>1) val=val.slice(0,-2)+'…'; ctx.fillText(val,x,y);
}
function wrapLines(raw,size,maxW){
 ctx.font=size+'px Arial, sans-serif'; const out=[];
 for(const para of (raw||'').split(/\n/)){
  if(!para.trim()){out.push('');continue;} let line='';
  for(const word of para.trim().split(/\s+/)){
   let rest=word;
   while(rest){
    const candidate=line?line+' '+rest:rest;
    if(ctx.measureText(candidate).width<=maxW){line=candidate;rest='';break;}
    if(line){out.push(line);line='';continue;}
    let part='',cut=0;
    for(let i=0;i<rest.length;i++){
     const test=part+rest[i];
     if(ctx.measureText(test).width>maxW&&part){cut=i;break;} part=test;
    }
    if(cut){out.push(part);rest=rest.slice(cut);} else {line=part;rest='';}
   }
  }
  if(line)out.push(line);
 }
 return out;
}
function roundRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();return ctx;}
function draw(){
 if(!bg.complete)return;
 const raw=document.getElementById('orientacao').value;
 const semPrazo=document.getElementById('semPrazo').checked;
 const size=31,lh=42,maxW=855;
 const lines=wrapLines(raw,size,maxW);
 const shown=Math.max(2,lines.length); // só um pequeno respiro quando o texto é curto
 const cardTop=560, subjectTop=600, sectionY=775, textTop=825;
 const textBottom=textTop+shown*lh;
 const dividerY=textBottom+32;
 const prazoTop=dividerY+42;
 const prazoLines=semPrazo?[]:wrapLines(document.getElementById('prazo').value,28,700).slice(0,3);
 const prazoH=semPrazo?0:Math.max(135,86+prazoLines.length*34);
 const footerY=semPrazo?dividerY+72:prazoTop+prazoH+65;
 const cardBottom=footerY+55;
 const H=Math.max(1220,cardBottom+90);
 canvas.width=1080;canvas.height=H;
 ctx.clearRect(0,0,1080,H);
 ctx.fillStyle='#fff6ef';ctx.fillRect(0,0,1080,H);
 // Usa apenas o cabeçalho original; todo o cartão inferior é redesenhado para não duplicar elementos.
 ctx.drawImage(bg,0,0,1080,445,0,0,1080,445);
 // Fundo limpo abaixo do cabeçalho: impede que o assunto original embutido na imagem apareça novamente.
 ctx.fillStyle='#fff6ef';ctx.fillRect(0,445,1080,115);
 // faixa curva suave de transição
 ctx.fillStyle='#fff6ef';ctx.beginPath();ctx.moveTo(0,425);ctx.quadraticCurveTo(270,470,540,442);ctx.quadraticCurveTo(810,418,1080,448);ctx.lineTo(1080,560);ctx.lineTo(0,560);ctx.closePath();ctx.fill();
 text(document.getElementById('data').value,111,515,29,'#b92f3b',true,180);
 // cartão branco
 ctx.fillStyle='#fff';roundRect(ctx,60,cardTop,960,cardBottom-cardTop,38);ctx.fill();
 // assunto
 ctx.fillStyle='#fee7dc';roundRect(ctx,100,subjectTop,875,110,24);ctx.fill();
 ctx.fillStyle='#ee5365';ctx.beginPath();ctx.arc(157,subjectTop+55,38,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(157,subjectTop+32);ctx.lineTo(157,subjectTop+78);ctx.moveTo(134,subjectTop+55);ctx.lineTo(180,subjectTop+55);ctx.stroke();
 text('ASSUNTO DE HOJE',214,subjectTop+43,22,'#b6404d',true,500);
 text(document.getElementById('titulo').value,214,subjectTop+86,40,'#482f3a',true,710);
 text('O QUE PRECISAMOS SABER?',105,sectionY,27,'#b92f3b',true,800);
 lines.forEach((line,i)=>{ctx.fillStyle='#4e4750';ctx.font=size+'px Arial, sans-serif';ctx.fillText(line,105,textTop+i*lh)});
 // divisor acompanha o fim real do texto
 ctx.save();ctx.strokeStyle='#e6e0dd';ctx.lineWidth=3;ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(105,dividerY);ctx.lineTo(970,dividerY);ctx.stroke();ctx.restore();
 if(!semPrazo){
  ctx.fillStyle='#e3f3ef';roundRect(ctx,100,prazoTop,875,prazoH,24);ctx.fill();
  ctx.fillStyle='#39a99d';ctx.beginPath();ctx.arc(157,prazoTop+prazoH/2,38,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(157,prazoTop+prazoH/2-20);ctx.lineTo(157,prazoTop+prazoH/2+2);ctx.lineTo(174,prazoTop+prazoH/2+18);ctx.stroke();ctx.lineCap='butt';
  text('PRAZO OU LEMBRETE',212,prazoTop+45,24,'#31877f',true,650);
  prazoLines.forEach((line,i)=>{ctx.fillStyle='#36565a';ctx.font='28px Arial, sans-serif';ctx.fillText(line,212,prazoTop+88+i*34)});
 }
 text('Assessoria de Enfermagem · Fundação Hemominas',105,footerY,23,'#8a7c80',false,820);
 // fechamento inferior simples, sempre proporcional à altura final
 ctx.fillStyle='#e84b5f';ctx.beginPath();ctx.moveTo(0,H-48);ctx.quadraticCurveTo(300,H-105,570,H-62);ctx.quadraticCurveTo(830,H-20,1080,H-70);ctx.lineTo(1080,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
}
bg.onload=draw;ids.forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('baixar').addEventListener('click',()=>{
 draw();
 // Versão para computador: força o download do PNG, sem abrir o menu de compartilhamento.
 try{
  canvas.toBlob((blob)=>{
   if(!blob){
    // Fallback para navegadores que não retornem Blob.
    try{
     const a=document.createElement('a');
     a.href=canvas.toDataURL('image/png');
     a.download='gota-do-dia.png';
     document.body.appendChild(a);a.click();a.remove();
    }catch(e){alert('Não foi possível gerar a imagem PNG neste navegador.');}
    return;
   }
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url;a.download='gota-do-dia.png';
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),5000);
  },'image/png');
 }catch(e){
  try{
   const a=document.createElement('a');
   a.href=canvas.toDataURL('image/png');
   a.download='gota-do-dia.png';
   document.body.appendChild(a);a.click();a.remove();
  }catch(err){alert('Não foi possível gerar a imagem PNG neste navegador.');}
 }
});
document.getElementById('semPrazo').addEventListener('change',function(){const p=document.getElementById('prazo');p.disabled=this.checked;p.style.display=this.checked?'none':'block';draw();});
</script></body></html>
